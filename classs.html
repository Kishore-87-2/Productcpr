<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Quality Analyzer Comparison</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            position: relative;
        }

        .export-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }

        .export-btn:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        select {
            padding: 8px;
            margin: 10px;
        }

        .compare-all-btn {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            border-radius: 5px;
        }

        .compare-all-btn:hover {
            background-color: #218838;
        }
    </style>
    <script src="timer.js?v=1min" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="comparison-sheet.js?v=1" data-sheet-id="1210" data-fallback="comparison-data/1210.json" defer></script>
</head>
<body>
    <button class="export-btn" data-comparison-action="export-current" disabled>Export</button>

    <h1>Power Quality Analyzer Comparison</h1>

    <label for="productSelect">Select Product:</label>
    <select id="productSelect">
        <option value="SONEL PQM-707">SONEL PQM-707</option>
    </select>

    <label for="competitorSelect">Select Competitor 1:</label>
    <select id="competitorSelect"></select>

    <label for="competitorSelect2">Select Competitor 2:</label>
    <select id="competitorSelect2"></select>

    <button class="compare-all-btn" data-comparison-action="compare-all" disabled>Compare All Products</button>

    <table id="comparisonTable"></table>

    
</body>
</html>
