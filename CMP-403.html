<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Comparison</title>
    <!-- Include jsPDF library for PDF export -->
    
    
    <style>
        /* CSS Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1200px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .dropdowns {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .buttons {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .comparison-result {
            margin-top: 20px;
            text-align: left;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
    <script src="timer.js?v=1min" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="comparison-sheet.js?v=1" data-sheet-id="1203" data-fallback="comparison-data/1203.json" defer></script>
</head>
<body>
    <div class="container">
        <h1>Product Comparison Tool</h1>
        <div class="dropdowns">
            <div>
                <label for="product">Select Product:</label>
                <select id="product">
                    <option value="Sonel CMP-403">Sonel CMP-403</option>
                    <option value="Sonel CMP-402">Sonel CMP-402</option>
                </select>
            </div>
            <div>
                <label for="competitor1">Select Competitor 1:</label>
                <select id="competitor1">
                    <option value="Sonel CMP-403">Sonel CMP-403</option>
                    <option value="Sonel CMP-402">Sonel CMP-402</option>
                    <option value="Megger DCM-320">Megger DCM-320</option>
                    <option value="Fluke 301A/301A+">Fluke 301A/301A+</option>
                    <option value="Fluke 301B">Fluke 301B</option>
                </select>
            </div>
            <div>
                <label for="competitor2">Select Competitor 2:</label>
                <select id="competitor2">
                    <option value="None">None</option>
                    <option value="Sonel CMP-403">Sonel CMP-403</option>
                    <option value="Sonel CMP-402">Sonel CMP-402</option>
                    <option value="Megger DCM-320">Megger DCM-320</option>
                    <option value="Fluke 301A/301A+">Fluke 301A/301A+</option>
                    <option value="Fluke 301B">Fluke 301B</option>
                </select>
            </div>
        </div>

        <div class="buttons">
            <button data-comparison-action="compare-selected" disabled>Compare Selected</button>
            <button data-comparison-action="compare-all" disabled>Compare All</button>
            <button data-comparison-action="export-selected" disabled>Export Selected to PDF</button>
            <button data-comparison-action="export-all" disabled>Export All to PDF</button>
        </div>

        <div id="comparisonResult" class="comparison-result"></div>
    </div>

    
</body>
</html>
