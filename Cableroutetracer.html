<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable Route Tracer Comparison Tool</title>
    
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #2d3748;
        }
        .container {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 1280px;
        }
        h1 {
            color: #1a202c;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 24px;
        }
        .dropdowns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .dropdown-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }
        select {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: #f7fafc;
            font-size: 0.875rem;
            color: #2d3748;
            transition: border-color 0.2s ease;
        }
        select:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background-color: #3182ce;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        button:hover {
            background-color: #2b6cb0;
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .comparison-result {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.875rem;
        }
        th, td {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }
        th {
            background-color: #edf2f7;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #f7fafc;
        }
        tr:hover {
            background-color: #e6f0fa;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .dropdowns {
                grid-template-columns: 1fr;
            }
            button {
                padding: 10px 16px;
                font-size: 0.75rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            table {
                font-size: 0.75rem;
            }
            th, td {
                padding: 8px;
            }
        }
    </style>
    <script src="timer.js?v=3min" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="comparison-sheet.js?v=2" data-sheet-id="1101" data-fallback="comparison-data/1101.json" defer></script>
</head>
<body>
    <div class="container">
        <h1>Cable Route Tracer Comparison Tool</h1>
        
        <div class="dropdowns">
            <div class="dropdown-group">
                <label for="product">Select Product:</label>
                <select id="product" aria-label="Select main product">
                    <option value="" disabled selected>Select a product</option>
                    <option value="Sonel LKZ-2500">Sonel LKZ-2500</option>
                    
                </select>
            </div>
            <div class="dropdown-group">
                <label for="competitor1">Select Competitor 1:</label>
                <select id="competitor1" aria-label="Select first competitor">
                    <option value="" disabled selected>Select a competitor</option>
                    <option value="Sonel LKZ-2500">Sonel LKZ-2500</option>
                    <option value="RD 8200/RD 8200 G">RD 8200/RD 8200 G</option>
                    <option value="RD7200">RD7200</option>
                    <option value="Stanlay STLOC5DL/GPS">Stanlay STLOC5DL/GPS</option>
                    <option value="Stanlay STLOC10/GPS">Stanlay STLOC10/GPS</option>
                    <option value="Technoac AG-309.15G">Technoac AG-309.15G</option>
                    <option value="Ridgid SR -20/ST-510">Ridgid SR -20/ST-510</option>
                </select>
            </div>
            <div class="dropdown-group">
                <label for="competitor2">Select Competitor 2:</label>
                <select id="competitor2" aria-label="Select second competitor">
                    <option value="" disabled selected>Select a competitor</option>
                    <option value="None">None</option>
                    <option value="Sonel LKZ-2500">Sonel LKZ-2500</option>
                    <option value="RD 8200/RD 8200 G">RD 8200/RD 8200 G</option>
                    <option value="RD7200">RD7200</option>
                    <option value="Stanlay STLOC5DL/GPS">Stanlay STLOC5DL/GPS</option>
                    <option value="Stanlay STLOC10/GPS">Stanlay STLOC10/GPS</option>
                    <option value="Technoac AG-309.15G">Technoac AG-309.15G</option>
                    <option value="Ridgid SR -20/ST-510">Ridgid SR -20/ST-510</option>
                </select>
            </div>
        </div>

        <div class="buttons">
            <button data-comparison-action="compare-selected" disabled>Compare Selected</button>
            <button data-comparison-action="compare-all" disabled>Compare All</button>
            <button data-comparison-action="export-selected" disabled>Export Selected to PDF</button>
            <button data-comparison-action="export-all" disabled>Export All to PDF</button>
            <button data-comparison-action="clear" disabled>Clear Selections</button>
        </div>

        <div id="comparisonResult" class="comparison-result"></div>
    </div>

    
</body>
</html>
