<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Comparison</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1400px;
            text-align: center;
            position: relative;
        }

        h1 {
            margin-bottom: 20px;
            color: #1a1a1a;
            font-size: 2rem;
            background: linear-gradient(90deg, #007bff, #00c4ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .dropdowns {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 0.9rem;
            color: #333;
            font-size: 0.9rem;
            text-align: left;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f9f9f9;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .compare-all-btn {
            background-color: #28a745;
        }

        .compare-all-btn:hover {
            background-color: #218838;
        }

        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }

        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9rem;
        }

        th, td {
            word-wrap: break-word;
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 2;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .loading {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #dc3545;
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
        }

        .notification {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border-radius: 4px;
            text-align: center;
        }

        #tableContainer {
            overflow-x: auto;
            max-width: 100%;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            table {
                font-size: 0.8rem;
            }
            th, td {
                padding: 8px;
            }
        }

        /* PDF-specific styles */
        .pdf-export-table th, .pdf-export-table td {
            font-size: 10px !important;
            padding: 6px !important;
            border: 1px solid #000 !important;
        }
    </style>
    <script src="timer.js?v=3min" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="comparison-sheet.js?v=2" data-sheet-id="1227" data-fallback="comparison-data/1227.json" defer></script>
</head>
<body>
    <div class="container">
        <h1>Product Comparison</h1>
        <div class="dropdowns">
            <div>
                <label for="productSelect">Select Product:</label>
                <select id="productSelect"></select>
            </div>
            <div>
                <label for="competitorSelect">Select Competitor:</label>
                <select id="competitorSelect"></select>
            </div>
            <div>
                <label for="competitorSelect2">Select Competitor 2:</label>
                <select id="competitorSelect2"></select>
            </div>
        </div>

        <div class="buttons">
            <button id="compareSelectedBtn" class="tooltip" data-comparison-action="compare-selected" disabled>Compare Selected</button>
            <button id="compareAllBtn" class="compare-all-btn tooltip" data-comparison-action="compare-all" disabled>Compare All Products</button>
            <button id="exportSelectedBtn" class="tooltip" data-comparison-action="export-selected" disabled>Export Selected to PDF</button>
            <button id="exportAllBtn" class="tooltip" data-comparison-action="export-all" disabled>Export All to PDF</button>
            <button id="clearSelectionBtn" class="tooltip" data-comparison-action="clear" disabled>Clear Selection</button>
        </div>

        <div id="loading" class="loading"></div>
        <div id="errorMessage" class="error-message"></div>
        <div id="notification" class="notification"></div>
        <div id="tableContainer">
            <table id="productComparison"></table>
        </div>
    </div>

    
</body>
</html>
