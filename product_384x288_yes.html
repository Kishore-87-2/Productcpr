<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KT-560 vs Competitors</title>
    <!-- jsPDF + autoTable -->
    
    
    <style>
        :root {
            --blue: #007bff;
            --light-blue: #e7f3ff;
            --white: #ffffff;
            --border-blue: #cce5ff;
            --text: #1a1a1a;
            --gray-bg: #f8fbff;
            --error: #dc3545;
            --success: #28a745;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--gray-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            background-color: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 123, 255, 0.1);
            width: 100%;
            max-width: 1400px;
            border: 1px solid var(--border-blue);
        }

        h1 {
            margin: 0 0 30px 0;
            font-size: 2rem;
            text-align: center;
            font-weight: 600;
            background: linear-gradient(90deg, var(--blue), #00c4ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .dropdowns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--blue);
            font-size: 0.95rem;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border-blue);
            border-radius: 8px;
            background-color: var(--white);
            font-size: 1rem;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background-color: var(--blue);
            color: var(--white);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        button:hover:not(:disabled) {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: var(--white);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            z-index: 100;
            margin-bottom: 8px;
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }

        .comparison-result {
            margin-top: 20px;
            overflow-x: auto;
            max-height: 600px;
            border-radius: 10px;
            border: 1px solid var(--border-blue);
            background-color: var(--light-blue);
            padding: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            background-color: var(--white);
            table-layout: fixed;
        }

        th, td {
            padding: 14px;
            border: 1px solid var(--border-blue);
            text-align: left;
            vertical-align: top;
            word-wrap: break-word;
        }

        th {
            background-color: var(--blue);
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }

        tr:nth-child(even) td {
            background-color: #f5fbff;
        }

        h3 {
            margin: 0 0 15px 0;
            color: var(--blue);
            font-size: 1.3rem;
            text-align: center;
            font-weight: 600;
        }

        .loading {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--blue);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: var(--error);
            margin: 15px 0;
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
        }

        .notification {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: var(--success);
            color: var(--white);
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .dropdowns { grid-template-columns: 1fr; }
            .buttons { flex-direction: column; align-items: center; }
            button { width: 100%; max-width: 300px; }
        }
    </style>
    <script src="timer.js?v=1min" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="comparison-sheet.js?v=1" data-sheet-id="1233" data-fallback="comparison-data/1233.json" defer></script>
</head>
<body>
    <div class="container">
        <h1>KT-560 vs Competitors</h1>

        <div class="dropdowns">
            <div>
                <label for="product">Select Sonel Product:</label>
                <select id="product"></select>
            </div>
            <div>
                <label for="competitor1">Competitor 1:</label>
                <select id="competitor1"></select>
            </div>
            <div>
                <label for="competitor2">Competitor 2:</label>
                <select id="competitor2"></select>
            </div>
        </div>

        <div class="buttons">
            <button id="compareSelectedBtn" class="tooltip" data-comparison-action="compare-selected" disabled>Compare Selected</button>
            <button id="compareAllBtn" class="tooltip" data-comparison-action="compare-all" disabled>Compare All</button>
            <button id="exportSelectedBtn" class="tooltip" data-comparison-action="export-selected" disabled>Export Selected</button>
            <button id="exportAllBtn" class="tooltip" data-comparison-action="export-all" disabled>Export All</button>
            <button id="clearBtn" class="tooltip" data-comparison-action="clear" disabled>Clear Selection</button>
        </div>

        <div id="loading" class="loading"></div>
        <div id="errorMessage" class="error-message"></div>
        <div id="notification" class="notification"></div>
        <div id="comparisonResult" class="comparison-result"></div>
    </div>

    
</body>
</html>
