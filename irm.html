<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonel Product Comparison</title>
    
  
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 30px 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #4EC0E0, #2A9BC9);
            color: white;
            padding: 20px 25px;
            text-align: center;
            position: relative;
        }
        .home-btn {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px 20px;
            background: rgba(255,255,255,0.95);
            color: #2A9BC9;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
        }
        .home-btn:hover { background: white; }
        h1 { font-size: 28px; font-weight: 600; margin: 0; }
        .controls { padding: 30px; display: flex; flex-wrap: wrap; gap: 20px; background: #f8f9fa; border-bottom: 1px solid #eee; }
        .select-group { flex: 1; min-width: 280px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        select { width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .buttons { padding: 25px 30px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; background: white; }
        button {
            padding: 12px 24px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px;
            cursor: pointer; min-width: 160px;
        }
        .btn-compare { background: #4EC0E0; color: white; }
        .btn-all { background: #28a745; color: white; }
        .btn-export { background: #4EC0E0; color: white; }
        .btn-clear { background: #6c757d; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f1f3f5; font-weight: 600; }
        tr:hover { background: #f8f9fa; }
        #loading { padding: 40px; text-align: center; color: #666; font-size: 16px; }
    </style>
    <script src="timer.js?v=3min" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="comparison-sheet.js?v=2" data-sheet-id="1213" data-fallback="comparison-data/1213.json" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="page2.html" class="home-btn">← Home</a>
            <h1>Sonel vs Competitors</h1>
        </header>
        <div class="controls">
            <div class="select-group">
                <label>Select Sonel Product:</label>
                <select id="productSelect"></select>
            </div>
            <div class="select-group">
                <label>Competitor 1:</label>
                <select id="competitorSelect"></select>
            </div>
            <div class="select-group">
                <label>Competitor 2:</label>
                <select id="competitorSelect2">
                    <option value="None">None</option>
                </select>
            </div>
        </div>
        <div class="buttons">
            <button class="btn-compare" data-comparison-action="compare-selected" disabled>Compare Selected</button>
            <button class="btn-all" data-comparison-action="compare-all" disabled>Compare All</button>
            <button class="btn-export" data-comparison-action="export-selected" disabled>Export Selected</button>
            <button class="btn-export" data-comparison-action="export-all" disabled>Export All</button>
            <button class="btn-clear" data-comparison-action="clear" disabled>Clear Selection</button>
        </div>
        <div id="loading">Loading product data...</div>
        <table id="comparisonTable"></table>
    </div>

    
</body>
</html>
